<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>greenelabs.dev</title>
<meta name="description" content="greenelabs.dev — under construction.">
<style>
  :root {
    --bg: #0a0e12;
    --bg-2: #10161c;
    --fg: #e8edf2;
    --muted: #7c8a99;
    --accent: #3ee6a8;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    overflow: hidden;
    position: relative;
  }
  .grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--bg-2) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-2) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, black 10%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, black 10%, transparent 75%);
    pointer-events: none;
  }
  .glow {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 60vmax;
    height: 60vmax;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(62, 230, 168, 0.10) 0%, rgba(62, 230, 168, 0) 60%);
    pointer-events: none;
  }
  main {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 560px;
  }
  .mark {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 40px;
  }
  .mark .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 16px 2px rgba(62, 230, 168, 0.6);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .mark span {
    font-size: 15px;
    letter-spacing: 0.14em;
    color: var(--muted);
    text-transform: uppercase;
  }
  h1 {
    font-size: clamp(2rem, 7vw, 3.25rem);
    font-weight: 650;
    letter-spacing: -0.02em;
    margin: 0 0 16px;
    line-height: 1.1;
  }
  h1 .dev { color: var(--accent); }
  p.tagline {
    color: var(--muted);
    font-size: clamp(0.95rem, 2.2vw, 1.1rem);
    line-height: 1.6;
    margin: 0 auto;
    max-width: 40ch;
  }
  .bar {
    margin: 40px auto 0;
    width: 220px;
    height: 3px;
    border-radius: 3px;
    background: rgba(232, 237, 242, 0.08);
    overflow: hidden;
  }
  .bar span {
    display: block;
    height: 100%;
    width: 40%;
    border-radius: 3px;
    background: var(--accent);
    animation: sweep 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.55; transform: scale(0.8); }
  }
  @keyframes sweep {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .mark .dot, .bar span { animation: none; }
  }
</style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>
  <main>
    <div class="mark"><span class="dot" aria-hidden="true"></span><span>Building</span></div>
    <h1>greene<span class="dev">labs</span>.dev</h1>
    <p class="tagline">Something's being built here. Check back soon.</p>
    <div class="bar" aria-hidden="true"><span></span></div>
  </main>
</body>
</html>
